/* 八厅罗盘 */
.compass-section{padding-top:clamp(8px,2.4vw,22px);padding-bottom:clamp(18px,4vw,38px)}
.compass-wrap{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:clamp(24px,5vw,66px);align-items:center}
.compass{position:relative;width:clamp(248px,29vw,330px);aspect-ratio:1;margin:auto;isolation:isolate}
.compass::before{
  content:"";position:absolute;inset:-12%;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--gold) 14%,transparent),transparent 68%);
  animation:compassGlow 6s ease-in-out infinite alternate;
}
.compass__ring{
  position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,transparent 0 9deg,color-mix(in srgb,var(--gold) 66%,transparent) 9deg 11deg,transparent 11deg 26deg);
  -webkit-mask:radial-gradient(circle,transparent calc(100% - 3px),#000 calc(100% - 2px));
  mask:radial-gradient(circle,transparent calc(100% - 3px),#000 calc(100% - 2px));
  animation:compassSpin 34s linear infinite;pointer-events:none;
}
.compass__ring::after{
  content:"";position:absolute;inset:12%;border:1px solid color-mix(in srgb,var(--line) 78%,transparent);border-radius:50%;
}
.compass__needle{
  position:absolute;left:50%;top:19%;width:1px;height:31%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--gold-bright) 78%,transparent));
  transform-origin:50% 100%;animation:needleSweep 22s cubic-bezier(.45,0,.55,1) infinite;pointer-events:none;opacity:.7;
}
.compass__core{
  position:absolute;inset:29%;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 50% 34%,color-mix(in srgb,var(--gold) 13%,var(--void)),var(--void) 68%);
  border:1px solid var(--line);box-shadow:0 0 0 7px color-mix(in srgb,var(--gold) 4%,transparent),0 20px 55px rgba(0,0,0,.16);
  animation:coreBreathe 5.6s ease-in-out infinite;
}
.compass__core b{display:block;font-family:var(--serif);font-size:clamp(1.5rem,3vw,2rem);line-height:1;color:var(--gold-bright)}
.compass__core span{display:block;margin-top:5px;font-size:.62rem;letter-spacing:.22em;color:var(--ivory-dim)}
.compass__node{
  --r:clamp(96px,11.6vw,128px);
  position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;
  display:grid;place-items:center;text-decoration:none;
  color:var(--gold-bright);background:color-mix(in srgb,var(--void) 78%,transparent);
  border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);
  font-family:var(--serif);font-weight:600;font-size:.7rem;letter-spacing:.04em;
  transform:rotate(calc(var(--i) * 45deg)) translateY(calc(var(--r) * -1)) rotate(calc(var(--i) * -45deg));
  box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 0%,transparent);
  transition:color .22s,border-color .22s,background .22s,box-shadow .22s;
}
.compass__node:hover,.compass__node:focus-visible{
  color:var(--ivory);background:var(--gold);border-color:var(--gold-bright);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 15%,transparent),0 8px 22px rgba(0,0,0,.2);
}
.compass__node::after{
  content:attr(data-label);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);
  white-space:nowrap;font-family:var(--sans);font-size:.6rem;letter-spacing:.16em;color:var(--ivory-dim);
  background:color-mix(in srgb,var(--void) 88%,transparent);border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;opacity:0;translate:0 -3px;transition:.18s;pointer-events:none;
}
.compass__node:hover::after,.compass__node:focus-visible::after{opacity:1;translate:0 0}
.compass__copy{max-width:520px}
.compass__copy .section__kicker{color:var(--gold)}
.compass__copy h2{font-family:var(--serif);font-size:clamp(1.55rem,3.1vw,2.45rem);line-height:1.35;font-weight:600;letter-spacing:.04em;color:var(--ivory)}
.compass__copy h2 em{font-style:normal;color:var(--gold-bright)}
.compass__copy p{margin-top:14px;color:var(--ivory-dim);font-size:.92rem;line-height:1.9}
.compass__hint{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-size:.68rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.compass__hint::before{content:"";width:26px;height:1px;background:var(--gold)}
@media (max-width:860px){
  .compass-wrap{grid-template-columns:1fr;gap:26px}

  .compass__copy{order:2;text-align:center;margin:0 auto}

}
@media (prefers-reduced-motion:reduce){
  .compass__ring,.compass__needle,.compass__core,.compass::before,.nav__brand::before{animation:none!important}
  .ticker__row{animation:none!important}
  /* 这些装饰动画在后文重新声明过，会覆盖前面的减少动态效果规则，这里统一收口 */

/* 长列表用懒加载/分批与图片解码，不强上 content-visibility，避免交互卡被跳过渲染 */

/* 键盘/屏幕阅读器：罗盘节点有明确名称 */
.compass__node[aria-label]{cursor:pointer}

@keyframes compassSpin{to{transform:rotate(360deg)}}
@keyframes needleSweep{to{transform:rotate(360deg)}}
@keyframes compassGlow{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}
@keyframes coreBreathe{0%,100%{box-shadow:0 0 0 7px color-mix(in srgb,var(--gold) 4%,transparent),0 20px 55px rgba(0,0,0,.16)}50%{box-shadow:0 0 0 13px color-mix(in srgb,var(--gold) 7%,transparent),0 24px 70px rgba(0,0,0,.22)}}

/* 放映厅/灯箱：图片的 Ken Burns 缩放会在按下与抬起之间偷走 pointerup，
   让左右箭头看起来“点了不动”。图片只负责显示，点击交给父容器。 */
.chamber__img,.lightbox__img{pointer-events:none}
.chamber__close,.chamber__nav,.lightbox__close,.lightbox__nav{z-index:12}
.chamber__stage,.lightbox__plate{position:relative}


/* ============================================================
   v18.7.5 · 路由转场 / 响应反馈 / 移动端降级
   1) 原生 View Transition：从点击点绽开的圆形光门
   2) 不支持或低性能设备：桌面左右双幕、手机上下双幕
   3) 点击先有金色进度条与涟漪，转场期间禁止重复导航
   ============================================================ */
.route-progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:123;pointer-events:none;opacity:0;transition:opacity .16s var(--ease)}
.route-progress i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,var(--gold),var(--gold-bright),var(--gold));
  box-shadow:0 0 14px color-mix(in srgb,var(--gold-bright) 55%,transparent)}
body.is-routing{cursor:progress}
body.is-routing a,body.is-routing button{cursor:progress}
.route-progress.run{opacity:1}
.route-progress.run i{animation:routeFill .68s cubic-bezier(.22,1,.36,1) both}
@keyframes routeFill{0%{transform:scaleX(0)}62%{transform:scaleX(.82)}100%{transform:scaleX(1)}}

.route-ripple{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;z-index:122;pointer-events:none;
  border:1px solid color-mix(in srgb,var(--gold-bright) 65%,transparent);
  box-shadow:0 0 16px color-mix(in srgb,var(--gold-bright) 28%,transparent);
  animation:routeRipple .62s cubic-bezier(.22,1,.36,1) both}
@keyframes routeRipple{0%{opacity:.9;transform:scale(.32)}70%{opacity:.35}100%{opacity:0;transform:scale(6.4)}}

/* 原生 View Transition 仅保留给主题切换：从按钮位置绽开 */
html{--route-x:50%;--route-y:26%}
::view-transition-old(root){animation:themeOld .38s cubic-bezier(.4,0,.2,1) both}
::view-transition-new(root){animation:themeReveal .56s cubic-bezier(.16,.84,.28,1) both}
@keyframes themeOld{to{opacity:.72;transform:scale(.985)}}
@keyframes themeReveal{from{clip-path:circle(0px at var(--route-x) var(--route-y));opacity:.6}to{clip-path:circle(150% at var(--route-x) var(--route-y));opacity:1}}

/* 不支持 View Transition：双幕合拢，在遮罩下完成换页，再向两侧揭开 */
.scene-curtain{position:fixed;inset:0;z-index:2000;pointer-events:none;visibility:hidden;overflow:hidden;--route-in:.3s;--route-out:.36s}
.scene-curtain.is-active{visibility:visible}
.scene-curtain__panel{position:absolute;background:radial-gradient(ellipse at 50% 42%,rgba(197,161,90,.14),transparent 62%),linear-gradient(160deg,#20180f,#0b0806 74%);will-change:transform;transition:transform var(--route-out) cubic-bezier(.77,0,.18,1)}
.scene-curtain__panel--a{left:0;top:0;width:50.4%;height:100%;transform:translateX(-101%);border-right:1px solid color-mix(in srgb,var(--gold) 55%,transparent)}
.scene-curtain__panel--b{right:0;top:0;width:50.4%;height:100%;transform:translateX(101%);border-left:1px solid color-mix(in srgb,var(--gold) 55%,transparent)}
.scene-curtain.is-cover .scene-curtain__panel{transition-duration:var(--route-in)}
.scene-curtain.is-cover .scene-curtain__panel--a{transform:translateX(0)}
.scene-curtain.is-cover .scene-curtain__panel--b{transform:translateX(0)}
.scene-curtain.is-reveal .scene-curtain__panel--a{transform:translateX(-101%)}
.scene-curtain.is-reveal .scene-curtain__panel--b{transform:translateX(101%)}
.scene-curtain__seam{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:1px solid var(--gold);border-radius:50%;opacity:0;transform:scale(.5);transition:opacity .22s,transform .38s var(--ease);z-index:2}
.scene-curtain__orbit{position:absolute;inset:-24px;border:1px dashed color-mix(in srgb,var(--gold) 44%,transparent);border-radius:50%;opacity:.5;animation:curtainOrbit 14s linear infinite;pointer-events:none}
@keyframes curtainOrbit{to{transform:rotate(360deg)}}
.scene-curtain.is-active .scene-curtain__seam{opacity:.72;transform:scale(1) rotate(45deg)}
.scene-curtain.is-active .scene-curtain__mark{opacity:.68;transform:translate(-50%,0)}
.scene-curtain__seam::before,.scene-curtain__seam::after{content:"";position:absolute;left:50%;top:50%;background:var(--gold);transform:translate(-50%,-50%)}
.scene-curtain__seam::before{width:1px;height:56px;opacity:.7}
