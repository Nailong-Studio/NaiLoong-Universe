<section id="view-search" class="view" aria-label="馆藏检索界面">





  <div class="view__bar">





    <a class="view__back" href="#home">返回目录</a>





    <span class="view__title">馆 藏 检 索</span>





    <span class="view__count" id="searchCount">馆藏可检索</span>





  </div>





  <section class="section" style="padding-top:0">





    <div class="wrap">





      <form class="search" role="search" id="searchForm">





        <label class="sr-only" for="searchInput">检索馆藏</label>





        <input id="searchInput" type="search" placeholder="输入作品名或叙事关键词，如「星月夜」「圣诞」" autocomplete="off">





        <button class="search__clear" type="button" id="searchClear" aria-label="清空检索">清空</button>





        <button class="search__lucky" type="button" id="luckyBtn" aria-label="随机打开一件馆藏">随缘一观</button>





      </form>





      <div class="chips" id="searchChips" role="group" aria-label="按展厅筛选"></div>





      <div class="search__grid" id="searchGrid"></div>





      <p class="search__empty" id="searchEmpty" role="status" hidden>没有匹配的圣像，换个词或换间展厅试试。</p>





    </div>





  </section>





</section>
