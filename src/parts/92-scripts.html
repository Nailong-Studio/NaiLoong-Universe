<script>





(function(){





  "use strict";





  var doc = document;





  doc.documentElement.classList.add("js");





  var reduce = false;





  try{ reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

















  function safe(fn){





    try { fn(); }





    catch(e){ if (window.console && window.console.warn) window.console.warn("[圣殿]", e && e.message ? e.message : e); }





  }





  safe(function(){





  /* ---- 多视图路由：hash 驱动，主界面=目录入口，其余分界面 ---- */





  var VIEWS = ["home", "halls", "chronicle", "visit", "relics", "friends", "search", "about"];





  var viewEls = {};





  VIEWS.forEach(function(v){ viewEls[v] = doc.getElementById("view-" + v); });





  function closeOverlays(){





    var ch = doc.getElementById("chamber");





    if (ch && !ch.hidden){





      ch.hidden = true;





      var v = doc.getElementById("chamberVid");





      if (v && v.pause) v.pause();





    }





    var box = doc.getElementById("lightbox");





    if (box && typeof box.close === "function" && box.open){





      try{ if (window.NW && window.NW.closeSilent) window.NW.closeSilent(); else box.close(); }catch(e){}





    }





  }





  function smoothTo(el){





    if (!el) return;





    setTimeout(function(){





      el.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"});





    }, 70);





  }





  function setSolo(hallId){





    var body = doc.body;





    Array.prototype.forEach.call(doc.querySelectorAll("section.hall"), function(sec){





      sec.classList.toggle("hall--solo", !!hallId && sec.id === hallId);





    });





    body.classList.toggle("hall-solo", !!hallId);





  }





  /* ---- 顶部导航当前态 + 文档标题同步（浏览器历史/分享卡片可见） ---- */





  var topLinks = {};





  Array.prototype.forEach.call(doc.querySelectorAll(".nav__links a"), function(a){





    var id = (a.getAttribute("href") || "").replace("#", "");





    if (id) topLinks[id] = a;





  });





  var BASE_TITLE = doc.title || "奶蛙艺术宇宙 · 艺术圣殿";





  window.__baseTitle = BASE_TITLE;





  var VIEW_TITLES = { home:"圣殿之门", halls:"常设展", chronicle:"艺术史长河", visit:"朝圣之路", friends:"友站星图", search:"馆藏检索", about:"游客中心" };





  function syncNav(v){





    Object.keys(topLinks).forEach(function(k){





      var on = k === v;





      topLinks[k].classList.toggle("on", on);





      if (on) topLinks[k].setAttribute("aria-current", "page");





      else topLinks[k].removeAttribute("aria-current");





    });





  }





  function syncTitle(v){





    var t = VIEW_TITLES[v] || "";





    if (v === "halls" && doc.body.classList.contains("hall-solo")){





      var nm = doc.querySelector(".hall--solo .hall__name");





      if (nm && nm.textContent.trim()) t = nm.textContent.trim() + " · 常设展";





    }





    doc.title = t ? t + " · " + BASE_TITLE : BASE_TITLE;





  }





  window.NW = window.NW || {};





  window.NW.syncTitle = syncTitle;





  function navigate(){





    var h = (location.hash || "").replace(/^#/, "").replace(/%20/g, " ");





    var cur = doc.querySelector(".view.active");





    var v = cur ? cur.id.replace("view-", "") : "home";





    if (VIEWS.indexOf(h) >= 0) v = h;





    /* 单厅视图 #hall-N：留在展厅界面，只陈列该厅（厅号不存在时回落全部展厅，避免白屏） */





    if (/^hall-\d+$/.test(h) && doc.getElementById(h)){ v = "halls"; setSolo(h); }





    else if (/^hall-\d+$/.test(h)){ try{ history.replaceState(null, "", "#halls"); }catch(e){} h = "halls"; setSolo(null); }





    else if (!/^w-/.test(h)){ setSolo(null); }





    /* 作品深链 #w-<编号>：不关闭灯箱、不回滚顶部；兼容 #w-NW-x-xxx 带前缀写法，编号不存在时清理脏 hash */





    if (/^w-/.test(h)){





      VIEWS.forEach(function(k){ if (viewEls[k]) viewEls[k].classList.toggle("active", k === "halls"); });





      var no = decodeURIComponent(h.slice(2)).replace(/^NW-/, "");





      var hit = false;





      if (window.NW && window.NW.openByNo){





        try { hit = !!window.NW.openByNo(no); } catch(e){}





      }





      if (!hit){





        /* 首屏冷加载时灯箱模块尚未就绪：保留深链，轮询等它起来；编号无效才回落 */





        var tries = 0;





        var iv = setInterval(function(){





          tries++;





          var box = doc.getElementById("lightbox");





          if (box && box.open){ clearInterval(iv); return; }





          var ok = false;





          if (window.NW && window.NW.openByNo){





            try { ok = !!window.NW.openByNo(no); } catch(e){}





          }





          if (ok){ clearInterval(iv); }





          else if (tries > 40){ clearInterval(iv); try{ history.replaceState(null, "", "#halls"); }catch(e){} }





        }, 120);





      }





      return;





    }





    var deepTarget = null;





    if (VIEWS.indexOf(h) < 0 && h && h !== "top"){





      deepTarget = doc.getElementById(h);





      if (deepTarget){





        var host = deepTarget.closest ? deepTarget.closest(".view") : null;





        if (host) v = host.id.replace("view-", "");





      }





    }





    var applyView = function(){





      VIEWS.forEach(function(k){





        if (viewEls[k]) viewEls[k].classList.toggle("active", k === v);





      });





      syncNav(v);





      syncTitle(v);





    };





    if (!window.__firstNav && doc.startViewTransition && !window.__vtRunning){





      try{





        var vt = doc.startViewTransition(applyView);





        window.__vtRunning = true;





        var clr = function(){ window.__vtRunning = false; };





        ["ready","finished","updateCallbackDone"].forEach(function(k){





          if (vt[k] && vt[k].then){ vt[k].then(clr).catch(clr); }





        });





      }catch(e){ applyView(); }





    } else { applyView(); }





    closeOverlays();





    var fx = doc.getElementById("fxwipe");





    if (fx && !reduce){ fx.classList.remove("run"); void fx.offsetWidth; fx.classList.add("run"); }





    if (deepTarget && viewEls[v] && viewEls[v].contains(deepTarget)){





      smoothTo(deepTarget);





      return;





    }





    if (h && h !== v && h !== "top"){





      var t = doc.getElementById(h);





      if (t){










        if (viewEls[v] && viewEls[v].contains(t)){ smoothTo(t); return; }





      }





    }





    window.scrollTo(0, 0);





    /* 压过浏览器原生锚点跳转：切换视图后滚回顶部，并立即亮起首屏揭示元素 */





    setTimeout(function(){ window.scrollTo(0, 0); }, 80);





    setTimeout(function(){





      Array.prototype.forEach.call(doc.querySelectorAll(".view.active .reveal"), function(el){





        var rc = el.getBoundingClientRect();





        if (rc.top < window.innerHeight && rc.bottom > 0) el.classList.add("in");





      });





    }, 220);





  }





  window.addEventListener("hashchange", navigate);





  if (!location.hash){ try{ history.replaceState(null, "", "#home"); }catch(e){} }





  window.__firstNav = true;





  navigate();





  /* 直接打开 #halls/#chronicle 等视图深链时，浏览器原生锚点会在视图显示后再次滚动；





     加载完成后再归位一次，避免视图头被固定导航遮住 */





  var initialViewHash = VIEWS.indexOf((location.hash || "").replace(/^#/, "")) >= 0;





  if (initialViewHash) window.addEventListener("load", function(){ window.scrollTo(0, 0); });





  /* 单厅深链 #hall-N 下按 Esc 返回全部展厅（灯箱/放映厅打开时交给各自处理） */





  doc.addEventListener("keydown", function(e){





    if (e.key !== "Escape") return;





    var lb = doc.getElementById("lightbox");





    var ch = doc.getElementById("chamber");





    if (lb && lb.open) return;





    if (ch && !ch.hidden) return;





    if (doc.body.classList.contains("hall-solo")){ try{ location.hash = "#halls"; }catch(err){} }





  });





  });





  safe(function(){





  /* ---- 导航滚动状态 ---- */





  var nav = doc.getElementById("nav");





  var pbar = doc.getElementById("progressBar");





  var toTop = doc.getElementById("toTop");





  function onScroll(){





    var y = window.scrollY;





    nav.classList.toggle("scrolled", y > 40);





    if (pbar){





      var max = doc.documentElement.scrollHeight - window.innerHeight;





      pbar.style.width = (max > 0 ? Math.min(100, y / max * 100) : 0) + "%";





    }





    if (toTop) toTop.classList.toggle("show", y > 640);





    /* 长廊吸顶导览：下滚收起让位，停手或上滚即回 */





    var hn = doc.querySelector(".halls-nav");





    if (hn){





      if (y > 420 && y > onScroll._ly + 4){





        hn.classList.add("nav-autohide");





        clearTimeout(onScroll._ht);





        onScroll._ht = setTimeout(function(){ hn.classList.remove("nav-autohide"); }, 1100);





      }





      else if (y < onScroll._ly - 4 || y <= 420){





        hn.classList.remove("nav-autohide");





        clearTimeout(onScroll._ht);





      }





    }





    onScroll._ly = y;





  }





  window.addEventListener("scroll", onScroll, {passive:true});





  if (toTop) toTop.addEventListener("click", function(){





    try{ window.scrollTo({top:0, behavior:"smooth"}); }catch(e){ window.scrollTo(0,0); }





  });





  onScroll();





  onScroll();





  });





  safe(function(){





  /* ---- 展厅横滑：箭头滚动 ---- */





  Array.prototype.forEach.call(doc.querySelectorAll(".hall__ctl"), function(ctl){





    var track = ctl.parentElement.querySelector(".hall__track");





    if (!track) return;





    var prev = ctl.querySelector("[data-prev]");





    var next = ctl.querySelector("[data-next]");





    function step(dir){





      track.scrollBy({left: dir * Math.max(320, track.clientWidth * 0.82), behavior:"smooth"});





    }





    if (prev) prev.addEventListener("click", function(){ step(-1); });





    if (next) next.addEventListener("click", function(){ step(1); });





  });





  });





  /* ---- 趣味音效：点开作品=喂到，哈哈大笑；说明牌里再喂一口=被吃，噶就塞 ----





     issue #1（a72148508-hash）：「奶龙吃到就会哈哈大笑，被吃就是噶就塞」





     全部用 Web Audio 现场合成，不引入任何外部音频素材；无 AudioContext 的环境静默降级。 */





  safe(function(){





    var AC = window.AudioContext || window.webkitAudioContext;





    if (!AC) return;





    var btn = doc.getElementById("sfxBtn");





    var stored = null;





    try { stored = window.localStorage.getItem("nwSfx"); } catch(e){}





    var on = stored !== "off";





    var ctx = null;





    var armed = false;   /* 浏览器自动播放策略：只有真实手势之后才发声 */





    function arm(){ armed = true; }





    doc.addEventListener("pointerdown", arm, true);





    doc.addEventListener("keydown", arm, true);





    function ensure(){





      if (!ctx){ try { ctx = new AC(); } catch(e){ return null; } }





      if (ctx.state === "suspended"){ try { ctx.resume(); } catch(e){} }





      return ctx;





    }





    function tone(c, o){





      var osc = c.createOscillator(), g = c.createGain(), out = g, bq = null;





      osc.type = o.type || "triangle";





      osc.frequency.setValueAtTime(o.f0, o.t);





      if (o.f1 && o.f1 !== o.f0){ osc.frequency.exponentialRampToValueAtTime(Math.max(24, o.f1), o.t + o.dur); }





      g.gain.setValueAtTime(0.0001, o.t);





      g.gain.exponentialRampToValueAtTime(Math.max(0.001, o.peak), o.t + Math.min(0.02, o.dur * 0.25));





      g.gain.exponentialRampToValueAtTime(0.0001, o.t + o.dur);





      osc.connect(g);





      if (o.filter){





        bq = c.createBiquadFilter(); bq.type = o.filter;





        bq.frequency.value = o.fc || 1200; bq.Q.value = o.q || 0.8;





        g.connect(bq); out = bq;





      }





      out.connect(c.destination);





      osc.start(o.t); osc.stop(o.t + o.dur + 0.03);





    }





    /* 哈哈大笑：6 声短促的“he he he”，音高逐级下滑，带一点高次泛音 */





    function laugh(){





      if (!on || !armed) return false;





      var c = ensure(); if (!c) return false;





      var t0 = c.currentTime + 0.01;





      for (var i = 0; i < 6; i++){





        var f = 700 * Math.pow(0.93, i);





        tone(c, {t: t0 + i * 0.095, type: "triangle", f0: f * 0.82, f1: f, dur: 0.085, peak: 0.22 - i * 0.022, filter: "bandpass", fc: 1500, q: 0.7});





        tone(c, {t: t0 + i * 0.095, type: "sine", f0: f * 1.98, f1: f * 1.9, dur: 0.07, peak: 0.045});





      }





      return true;





    }





    /* 噶就塞：先一记下滑的“噶”，再两声闷下去的“塞” */





    function gone(){





      if (!on || !armed) return false;





      var c = ensure(); if (!c) return false;





      var t0 = c.currentTime + 0.01;





      tone(c, {t: t0,           type: "sawtooth", f0: 320, f1: 96, dur: 0.2,  peak: 0.15, filter: "lowpass", fc: 1100});





      tone(c, {t: t0 + 0.23,    type: "sine",     f0: 196, f1: 78, dur: 0.3,  peak: 0.18});





      tone(c, {t: t0 + 0.27,    type: "square",   f0: 120, f1: 62, dur: 0.12, peak: 0.06, filter: "lowpass", fc: 380});





      return true;





    }





    function paint(){





      if (!btn) return;





      btn.setAttribute("aria-pressed", on ? "true" : "false");





      btn.setAttribute("aria-label", on ? "趣味音效已开，点击关闭" : "趣味音效已关，点击开启");





      btn.setAttribute("title", on ? "趣味音效已开" : "趣味音效已关");





    }





    paint();





    if (btn) btn.addEventListener("click", function(){





      on = !on; armed = true; paint();





      try { window.localStorage.setItem("nwSfx", on ? "on" : "off"); } catch(e){}





      if (on) laugh();





    });





    window.NWSFX = { laugh: laugh, gone: gone, enabled: function(){ return on; }, armed: function(){ return armed; } };





  });





  safe(function(){





  /* ---- 灯箱：支持左右翻页 + 淡入过渡 ---- */





  var box = doc.getElementById("lightbox");





  if (box) {





    var lbNative = (typeof box.showModal === "function");





    var lbReturnHash = "#halls";





    var lbRestore = false;





    function lbOpenBox(){ if (lbNative) box.showModal(); else { box.setAttribute("open",""); box.classList.add("shown"); } }





    function lbCloseBox(restore){





      lbRestore = restore !== false;





      if (lbNative) box.close(); else { box.removeAttribute("open"); box.classList.remove("shown"); }





      try{ lbVid.pause(); }catch(e){}





    }





    var lbImg = doc.getElementById("lbImg");





    var lbVid = doc.getElementById("lbVid");





    var lbTitle = doc.getElementById("lbTitle");





    var lbHall = doc.getElementById("lbHall");





    var lbStory = doc.getElementById("lbStory");





    var lbCount = doc.getElementById("lbCount");





    var lbFull = doc.getElementById("lbFull");





    var lbNo = doc.getElementById("lbNo");





    var lbType = doc.getElementById("lbType");





    var lbOrigin = doc.getElementById("lbOrigin");





    /* 说明牌字段：馆藏编号 / 形制 / 原作对照（均由页面已有数据推导，不臆造年代与材质） */





    function typeLabel(media, isVid){





      if (isVid) return "圣影 · 视频短片";





      var src = media.getAttribute("src") || "";





      if (/\.gif($|\?)/i.test(src)) return "动态圣像 · GIF";





      return "静态圣像 · 数字绘画";





    }





    function originLabel(raw){





      if (!raw || raw === "#") return "本馆自藏";





      if (raw.charAt(0) === "#"){





        var eraEl = doc.getElementById(raw.slice(1));





        var tag = eraEl ? eraEl.querySelector(".era__tag") : null;





        return tag ? ("见艺术史长河 · " + String(tag.textContent).split("·")[0].trim()) : "本馆自藏";





      }





      if (raw.indexOf("http") !== 0) return "本馆自藏 · 原图随站分发";





      var fn = "";





      try { fn = decodeURIComponent(raw.split("/").pop()); } catch(e){ fn = raw.split("/").pop(); }





      return fn.replace(/\.[A-Za-z0-9]+$/, "").replace(/_0?\d+$/, "");





    }





    var lbClose = doc.getElementById("lbClose");





    var lbPrev = doc.getElementById("lbPrev");





    var lbNext = doc.getElementById("lbNext");





    var items = [];





    var hallSeq = {};





    var works = doc.querySelectorAll("#view-halls .work__frame img:not(.vid__cover), #view-halls .work__frame video");





    Array.prototype.forEach.call(works, function(media, idx){





      var isVid = media.tagName === "VIDEO";





      var sec = media.closest ? media.closest("section.hall") : null;





      var hid = sec ? sec.id.replace("hall-", "") : "X";





      hallSeq[hid] = (hallSeq[hid] || 0) + 1;





      var raw = media.getAttribute("data-original") || "#";





      items.push({





        img: media,





        src: media.getAttribute("src") || "",





        alt: media.getAttribute("alt") || media.getAttribute("aria-label") || "",





        title: media.getAttribute("data-title") || "",





        hall: media.getAttribute("data-hall") || "",





        story: media.getAttribute("data-narrative") || "",





        original: raw,





        no: "NW-" + hid + "-" + String(hallSeq[hid]).padStart(3, "0"),





        typeLabel: typeLabel(media, isVid),





        originLabel: originLabel(raw),





        type: isVid ? "video" : "img"





      });





      media.setAttribute("tabindex", "0");





      media.setAttribute("role", "button");





      media.setAttribute("aria-label", (media.getAttribute("data-title") || "馆藏作品") + " · 打开作品说明牌");





      media.addEventListener("click", function(){





        showWork(idx);





      });





      media.addEventListener("keydown", function(e){





        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); showWork(idx); }





      });





    });





    var cur = -1;





    var lbFadeTO = null;





    lbImg.addEventListener("load", function(){





      clearTimeout(lbFadeTO);





      lbImg.classList.remove("lb-fade");





      var nw = lbImg.naturalWidth || 0;





      if (nw > 0 && nw < 800) lbImg.classList.add("lb-small");





      else lbImg.classList.remove("lb-small");





    });





    /* 再喂一口：说明牌里点大图 = 它被吃了（键盘 Enter/Space 同效） */





    lbImg.setAttribute("tabindex", "0");





    lbImg.setAttribute("role", "button");





    lbImg.setAttribute("aria-label", String(lbImg.getAttribute("alt") || "作品大图") + "（再喂一口试试）");





    function feedAgain(e){





      if (e && e.type === "keydown" && !(e.key === "Enter" || e.key === " " || e.key === "Spacebar")) return;





      if (e && e.type === "keydown") e.preventDefault();





      try { window.NWSFX && window.NWSFX.gone(); } catch(err){}





    }





    lbImg.addEventListener("click", feedAgain);





    lbImg.addEventListener("keydown", feedAgain);





    function showWork(i){





      if (!box.open){





        var h0 = (location.hash || "").replace(/^#/, "");





        lbReturnHash = (h0 === "search" || /^hall-\d+$/.test(h0)) ? "#" + h0 : "#halls";





      }





      cur = (i + items.length) % items.length;





      var it = items[cur];





      if (it.type === "video"){





        lbImg.classList.remove("show");





        lbImg.removeAttribute("src");





        lbImg.classList.remove("lb-small");





        if (lbVid.getAttribute("src") !== it.src) lbVid.setAttribute("src", it.src);





        lbVid.classList.add("show");





        try { var vp = lbVid.play(); if (vp && vp.catch) vp.catch(function(){}); } catch(e){}





        lbFull.style.display = "none";





      } else {





        lbVid.pause();





        lbVid.removeAttribute("src");





        lbVid.classList.remove("show");





        lbImg.classList.add("show");





        if (lbImg.getAttribute("src") !== it.src){





          lbImg.classList.add("lb-fade");





          lbImg.setAttribute("src", it.src);





          clearTimeout(lbFadeTO);





          if (lbImg.complete && lbImg.naturalWidth > 0){





            lbImg.classList.remove("lb-fade");





          } else {





            lbFadeTO = setTimeout(function(){ lbImg.classList.remove("lb-fade"); }, 160);





          }





        } else {





          lbImg.classList.remove("lb-fade");





        }





        lbFull.style.display = "";





      }





      lbImg.setAttribute("alt", it.alt);

(function(){
  var doc=document, tick=false;
  function flush(){
    tick=false;
    var vh=window.innerHeight||800;
    var list=doc.querySelectorAll(".reveal:not(.in)");
    for(var i=0;i<list.length;i++){
      var r=list[i].getBoundingClientRect();
      if(r.top < vh + 180) list[i].classList.add("in");
    }
  }
  function queue(){ if(!tick){ tick=true; requestAnimationFrame(flush); } }
  window.addEventListener("scroll", queue, {passive:true});
  window.addEventListener("resize", queue);
  window.addEventListener("hashchange", queue);
  setTimeout(flush, 900);
})();
